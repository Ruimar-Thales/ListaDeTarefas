<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
    <title>Lista de Tarefas</title>
</head>
<body>
    <h1>Organizador de Tarefas</h1>
    <p id="mensagem" class="mensagem" role="status"></p>

    <div class="taskInput">
        <h2><strong>Cadastro de Tarefas:</strong></h2>
        <br>
        <form action="">
            <fieldset>
                <div class="taskDesc">
                    <label for="desc"><strong>Tarefa: </strong></label>
                    <input type="text" id="desc">
                </div>

                <div class="taskPriority">
                    <label><strong>Prioridade: </strong></label>
                    
                    <div class="priority">
                        <input type="radio" id="alta" name="prioridade" value="alta">
                        <label for="alta">ALTA</label>
                    </div>

                    <div class="priority">
                        <input type="radio" id="media" name="prioridade" value="media">
                        <label for="media">MÉDIA</label>
                    </div>

                    <div class="priority">
                        <input type="radio" id="baixa" name="prioridade" value="baixa">
                        <label for="baixa">BAIXA</label>
                    </div>

                </div>

                <div class="category">
                    <label for="categoria"><strong>Categoria:</strong></label>
                    <select name="categoria" id="categoria">
                        <option value="lazer">Lazer</option>
                        <option value="estudo">Estudo</option>
                        <option value="trabalho">Trabalho</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>

                <div class="taskAdd">
                    <br>
                    <button class="bnt" type="submit">Adicionar</button>
                </div>
            </fieldset>
        </form>
    </div>

    <div class="filtros">
        <button type="button" data-filtro="todas" class="ativo">Todas</button>
        <button type="button" data-filtro="pendentes">Pendentes</button>
        <button type="button" data-filtro="concluidas">Concluídas</button>
    </div>

    <div class="counter">
        <span>Total: <strong id="countTotal">0</strong></span>
        <span>Pendentes: <strong id="countPending">0</strong></span>
        <span>Concluídas: <strong id="countDone">0</strong></span>
    </div>  

    <section class="taskArea">
        <table class="taskList">
            <thead>
                <tr>
                    <th>Tarefa</th>
                    <th>Prioridade</th>
                    <th>Categoria</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody class="taskInfo" id="taskInfo">

            </tbody>
        </table>
    </section>

</body>
</html>
